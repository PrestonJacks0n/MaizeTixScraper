name: Keepalive

# GitHub disables scheduled workflows in a PUBLIC repo after 60 days with no
# repository activity. That is not a theoretical problem for this project:
#
#   repo created  2026-08-15
#   +60 days      2026-10-14   <- watcher would silently switch off here
#   UCLA game     2026-11-21
#
# You would get no alerts and no warning, because a disabled workflow simply
# stops running. This job pushes a heartbeat commit twice a month to keep the
# clock reset through the end of the season.

on:
  schedule:
    - cron: '17 8 1,15 * *'   # 1st and 15th, 08:17 UTC (off-the-hour = less queueing)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Push a heartbeat commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat.txt
          # --allow-empty so a same-second rerun still counts as activity.
          git commit --allow-empty -m "chore: keepalive heartbeat [skip ci]"
          git push
